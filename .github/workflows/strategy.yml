name: Forward Test Bot

on:
  schedule:
    # Runs every 15 minutes. GitHub's scheduler can lag a few minutes under
    # load, which is fine -- the bot only acts on NEW closed candles anyway.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

# Prevents overlapping runs. If a new run (scheduled or manual) starts while a
# previous one is still in progress -- or its state.json commit hasn't landed
# in the repo yet -- the new run WAITS instead of racing it. Without this,
# two runs can both read the same stale state.json, both independently
# "catch up" on the same range of candles, and both commit -- producing
# duplicate/tripled trade entries in the log (exactly what happened before
# this was added).
concurrency:
  group: forward-test-bot
  cancel-in-progress: false

# Needed so the workflow is allowed to commit the updated state/log files back
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Always start from the LATEST commit on the branch, in case another
          # run just pushed a newer state.json moments ago.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ccxt pandas numpy

      - name: Run bot (single pass)
        run: python3 forward_test_bot_ghactions.py

      - name: Commit updated state and log
        run: |
          git config user.name "forward-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json forward_test_log.csv
          git diff --quiet --cached || git commit -m "Bot run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Pull-rebase before pushing in case something else landed a commit
          # in the tiny window since checkout, then push.
          git pull --rebase origin main
          git push
